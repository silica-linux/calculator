<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" font-family="Helvetica, Arial, sans-serif" font-size="10">
<title>Calculator key press timing, digit and operator</title>
<rect width="560" height="210" fill="#ffffff"/>
<line x1="110.0" y1="180" x2="510.0" y2="180" stroke="#333"/>
<line x1="110.0" y1="180" x2="110.0" y2="184" stroke="#333"/><text x="110.0" y="196" text-anchor="middle" fill="#333">0</text>
<line x1="160.0" y1="180" x2="160.0" y2="184" stroke="#333"/><text x="160.0" y="196" text-anchor="middle" fill="#333">100</text>
<line x1="210.0" y1="180" x2="210.0" y2="184" stroke="#333"/><text x="210.0" y="196" text-anchor="middle" fill="#333">200</text>
<line x1="260.0" y1="180" x2="260.0" y2="184" stroke="#333"/><text x="260.0" y="196" text-anchor="middle" fill="#333">300</text>
<line x1="310.0" y1="180" x2="310.0" y2="184" stroke="#333"/><text x="310.0" y="196" text-anchor="middle" fill="#333">400</text>
<line x1="360.0" y1="180" x2="360.0" y2="184" stroke="#333"/><text x="360.0" y="196" text-anchor="middle" fill="#333">500</text>
<line x1="410.0" y1="180" x2="410.0" y2="184" stroke="#333"/><text x="410.0" y="196" text-anchor="middle" fill="#333">600</text>
<line x1="460.0" y1="180" x2="460.0" y2="184" stroke="#333"/><text x="460.0" y="196" text-anchor="middle" fill="#333">700</text>
<line x1="510.0" y1="180" x2="510.0" y2="184" stroke="#333"/><text x="510.0" y="196" text-anchor="middle" fill="#333">800</text>
<text x="510.0" y="208" text-anchor="end" fill="#666">ms from button down (button up assumed at 300 ms for drawing)</text>
<text x="10" y="74" fill="#333">Digit</text>
<polyline fill="none" stroke="#555555" stroke-width="2" points="110.0,80.0 153.0,80.0 153.0,48.0 238.0,40.0 287.5,40.0 387.5,80.0 510.0,80.0"/>
<text x="156.0" y="92" fill="#555555">+86</text>
<text x="287.5" y="36" fill="#555555">fade 200 ms</text>
<text x="10" y="154" fill="#333">Operator</text>
<polyline fill="none" stroke="#d07000" stroke-width="2" points="110.0,160.0 127.5,160.0 127.5,120.0 275.5,120.0 440.5,160.0 510.0,160.0"/>
<text x="130.5" y="172" fill="#d07000">+35</text>
<text x="275.5" y="116" fill="#d07000">fade 330 ms</text>
<line x1="260.0" y1="20" x2="260.0" y2="180" stroke="#999" stroke-dasharray="3 3"/><text x="260.0" y="14" text-anchor="middle" fill="#666">button up</text>
<line x1="110.0" y1="20" x2="110.0" y2="180" stroke="#999" stroke-dasharray="3 3"/><text x="110.0" y="14" text-anchor="middle" fill="#666">button down</text>
<text x="10" y="44" fill="#999">lighter</text><text x="10" y="92" fill="#999">rest</text>
</svg>
